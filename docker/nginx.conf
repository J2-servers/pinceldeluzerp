events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/xml text/javascript application/javascript application/json image/svg+xml;

  server {
    listen 80;
    listen 8080;
    server_name _;
    root /app/dist;
    index index.html;

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/local/ {
      proxy_pass http://127.0.0.1:8787/api/local/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
      proxy_pass http://127.0.0.1:8787/uploads/;
      proxy_set_header Host $host;
    }

    # Build do Vite: nome de arquivo muda a cada build (hash de conteudo),
    # entao pode cachear para sempre sem risco de servir versao velha.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      # index.html referencia os arquivos com hash em /assets/ — precisa
      # ser revalidado a cada request, senao um deploy novo fica preso
      # apontando pros arquivos velhos (que nem existem mais).
      add_header Cache-Control "no-cache" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
