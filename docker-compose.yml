services:
  pincel-luz-erp:
    build:
      context: .
      args:
        VITE_LOCAL_API_URL: ""
        VITE_LOCAL_API_TOKEN: "${PINCEL_LUZ_API_TOKEN:-}"
    container_name: pincel-luz-erp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PINCEL_LUZ_ADMIN_PASSWORD: "${PINCEL_LUZ_ADMIN_PASSWORD:-troque-esta-senha}"
      PINCEL_LUZ_API_TOKEN: "${PINCEL_LUZ_API_TOKEN:-}"
      PINCEL_LUZ_ALLOWED_ORIGINS: "${PINCEL_LUZ_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      PINCEL_LUZ_DB: "/app/database/pincel-luz-erp.sqlite"
    volumes:
      - ./database:/app/database
      - ./storage:/app/storage
